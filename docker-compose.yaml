# dkagent - Docker Compose 备用运行方式
#
# 镜像选择：默认使用 my-kali-agent（kali profile）
# 切换镜像：DKAGENT_IMAGE=dkagent-slim docker compose run --rm agent-shell
# 构建精简镜像：docker build -t dkagent-slim -f dockerfiles/Dockerfile.slim .
#
# 注：所有模式共享同一个持久化 Home 卷（agent_docker_kali-home），
#     与 dkagent CLI 完全互通，配置/历史/Agent 凭证跨模式保留。

services:
  # ========================================================
  # 🏠 模式 A: 调试/Shell模式 (shell)
  # 运行: docker compose run --rm agent-shell
  # 安全: 🟢 隔离级别 - 不挂载任何宿主机工作目录
  # 特点: 使用 named volume 持久化 /home/kali (保留工具配置和命令历史)
  # ========================================================
  agent-shell:
    build: .
    image: ${DKAGENT_IMAGE:-my-kali-agent}
    env_file:
      - .env
    volumes:
      - agent_docker_kali-home:/home/kali
    stdin_open: true
    tty: true
    command: /bin/zsh

  # ========================================================
  # 🧊 模式 B: 纯净/隔离模式 (isolated)
  # 运行: docker compose run --rm agent-isolated
  # 安全: 🟢 隔离级别 - 不挂载任何宿主机工作目录
  # 特点: 无任何挂载卷，纯净镜像环境，用完即焚
  # ========================================================
  agent-isolated:
    build: .
    image: ${DKAGENT_IMAGE:-my-kali-agent}
    env_file:
      - .env
    stdin_open: true
    tty: true
    command: /bin/zsh

  # ========================================================
  # 📂 模式 C: 沙盒副本模式 (sandboxed)
  # 运行: docker compose run --rm agent-sandboxed
  # 安全: 🟡 沙盒级别 - 只挂载 ./workspace 副本目录，保护原始项目文件
  # 特点: 支持持久化 home 卷，且自动进入 /home/kali/workspace 目录
  # ========================================================
  agent-sandboxed:
    build: .
    image: ${DKAGENT_IMAGE:-my-kali-agent}
    env_file:
      - .env
    volumes:
      - agent_docker_kali-home:/home/kali
      - ./workspace:/home/kali/workspace
    working_dir: /home/kali/workspace
    stdin_open: true
    tty: true
    command: /bin/zsh

volumes:
  agent_docker_kali-home:
